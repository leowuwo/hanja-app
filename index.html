<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>신나는 한자 놀이터 (8급~특급 · 사자성어 1000선)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .hanja-font {
      font-family: 'Noto Serif KR', 'Batang', serif;
      font-weight: 700;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #FFF9EC;
      color: #333;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 */
    header {
      background: linear-gradient(135deg, #FF8C42, #FF5E5B);
      color: #fff;
      padding: 6px 12px;
      font-size: clamp(0.95rem, 2.2vw, 1.12rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
      flex-shrink: 0;
    }

    header > div:first-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    .voice-select {
      background: rgba(255, 255, 255, 0.96);
      color: #333;
      border: 2px solid #FFE082;
      padding: 3px 6px;
      border-radius: 10px;
      font-size: clamp(0.75rem, 1.8vw, 0.85rem);
      cursor: pointer;
      outline: none;
    }

    .star-badge {
      background: #FFD166;
      color: #5A3A00;
      padding: 3px 8px;
      border-radius: 14px;
      font-size: clamp(0.76rem, 1.8vw, 0.88rem);
      white-space: nowrap;
    }

    /* 상단 탭 내비게이션 */
    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 5px 8px;
      background: #FFF1D0;
      flex-shrink: 0;
    }

    @media (min-width: 720px) {
      nav {
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        padding: 6px 12px;
      }
    }

    .nav-btn {
      background: #fff;
      border: 2px solid #FFD166;
      border-radius: 10px;
      padding: 5px 4px;
      font-size: clamp(0.76rem, 1.7vw, 0.86rem);
      cursor: pointer;
      color: #444;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-btn.active {
      background: #FF7A00;
      color: #fff;
      border-color: #D96500;
    }

    /* 메인 영역 및 섹션 */
    main {
      flex: 1;
      padding: 8px 10px 10px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      main {
        padding: 10px 14px 12px;
      }
    }

    @media (orientation: landscape) and (max-height: 540px) {
      header {
        padding: 4px 12px;
      }
      nav {
        grid-template-columns: repeat(6, 1fr);
        padding: 3px 8px;
        gap: 4px;
      }
      .nav-btn {
        padding: 4px 6px;
        font-size: 0.78rem;
      }
      main {
        max-width: 100%;
        padding: 5px 12px 6px;
      }
      h2 {
        font-size: 0.98rem;
        margin-bottom: 4px;
      }
      .top-category-bar {
        padding: 4px 8px;
        margin-bottom: 4px;
      }
    }

    .section {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .section.active {
      display: flex;
    }

    h2 {
      text-align: center;
      color: #E06000;
      font-size: clamp(1rem, 2.3vw, 1.2rem);
      margin: 0 0 6px 0;
      flex-shrink: 0;
      line-height: 1.25;
    }

    .back-bar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .back-btn {
      background: #6C757D;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 11px;
      font-size: clamp(0.82rem, 2vw, 0.95rem);
      cursor: pointer;
      box-shadow: 0 2px 0 #495057;
    }

    .top-category-bar {
      background: #FFF2D6;
      border: 2px solid #FFD166;
      border-radius: 14px;
      padding: 6px 8px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }

    .cat-tabs {
      display: flex;
      justify-content: flex-start;
      gap: 3px;
      flex-wrap: nowrap;
      overflow-x: auto;
      max-width: 100%;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .cat-tabs::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      padding: 4px 7px;
      border-radius: 10px;
      border: none;
      background: #E6E6E6;
      font-size: clamp(0.74rem, 1.7vw, 0.84rem);
      cursor: pointer;
      color: #444;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cat-btn.active {
      background: #FF5E5B;
      color: #fff;
      box-shadow: 0 2px 0 #C9423F;
    }

    .count-info {
      text-align: center;
      color: #666;
      font-size: clamp(0.74rem, 1.7vw, 0.84rem);
      margin-bottom: 4px;
      flex-shrink: 0;
      line-height: 1.25;
    }

    #hanjaListView, #idiomListView {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    .grade-summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2px;
      margin-bottom: 4px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      font-size: clamp(0.72rem, 1.6vw, 0.82rem);
    }

    .grade-summary-table th, .grade-summary-table td {
      border: 1px solid #F0D9A7;
      padding: 4px 5px;
      text-align: center;
    }

    .grade-summary-table th {
      background: #FFE8B3;
      color: #5A3A00;
    }

    .grade-summary-table tr {
      cursor: pointer;
    }

    .grade-summary-table tr.active-row {
      background: #FFF0D6;
      font-weight: bold;
    }

    /* 한자 그리드 및 카드 */
    .hanja-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
      gap: 7px;
      padding-bottom: 4px;
    }

    @media (min-width: 640px) {
      .hanja-grid {
        grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
        gap: 9px;
      }
    }

    .hanja-card {
      background: #fff;
      border-radius: 14px;
      padding: 8px 5px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
      border: 2px solid #FFE082;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .grade-tag {
      position: absolute;
      top: 5px;
      left: 6px;
      font-size: 0.66rem;
      background: #FFF1D0;
      color: #B85D00;
      padding: 1px 5px;
      border-radius: 7px;
    }

    .write-tag {
      position: absolute;
      top: 5px;
      right: 6px;
      font-size: 0.64rem;
      background: #E0F7FA;
      color: #00695C;
      padding: 1px 5px;
      border-radius: 7px;
    }

    .hanja-char {
      font-size: clamp(2rem, 5.5vw, 2.7rem);
      line-height: 1.15;
      color: #222;
      margin-top: 12px;
    }

    .hanja-huneum {
      font-size: clamp(0.8rem, 2vw, 0.92rem);
      color: #E06000;
      margin-top: 3px;
      word-break: keep-all;
    }

    .hanja-meta {
      font-size: 0.72rem;
      color: #888;
      margin-top: 1px;
    }

    /* 사자성어 그리드 및 카드 */
    .idiom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 7px;
      padding-bottom: 4px;
    }

    @media (min-width: 640px) {
      .idiom-grid {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 9px;
      }
    }

    .idiom-card {
      background: #fff;
      border-radius: 14px;
      padding: 8px 10px 20px 10px;
      text-align: left;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      border: 2px solid #A8DADC;
      cursor: pointer;
      position: relative;
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    }

    .idiom-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(27, 73, 101, 0.12);
      border-color: #457B9D;
    }

    .idiom-card:active {
      transform: scale(0.99);
    }

    .idiom-card.is-memorized {
      border-color: #FF922B;
      background: #FFFDF8;
    }

    .idiom-word {
      font-size: clamp(1.15rem, 3.2vw, 1.45rem);
      color: #1B4965;
      margin-bottom: 2px;
    }

    .idiom-read {
      font-size: clamp(0.82rem, 2.2vw, 0.95rem);
      color: #E06000;
      margin-bottom: 3px;
    }

    .idiom-mean {
      font-size: clamp(0.75rem, 1.9vw, 0.82rem);
      color: #555;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 한자 / 사자성어 크게 보기 화면 */
    .solo-view {
      background: #fff;
      border: 3px solid #FFD166;
      border-radius: 20px;
      padding: 10px 12px;
      text-align: center;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.08);
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
    }

    .solo-big-char {
      font-size: clamp(4.2rem, 17dvh, 9rem);
      line-height: 1.05;
      color: #222;
      margin: 2px 0;
    }

    .solo-idiom-word {
      font-size: clamp(2.2rem, 8.5dvh, 5.2rem);
      line-height: 1.12;
      color: #1B4965;
      margin: 2px 0;
      word-break: keep-all;
      max-width: 100%;
    }

    .solo-sub {
      font-size: clamp(1.15rem, 3.4dvh, 1.65rem);
      color: #E06000;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .solo-grade-chip {
      display: inline-block;
      font-size: clamp(0.75rem, 2dvh, 0.88rem);
      background: #E6F4F1;
      color: #1B4965;
      border: 1.5px solid #A8DADC;
      padding: 2px 10px;
      border-radius: 11px;
      margin-bottom: 4px;
    }

    .solo-detail {
      font-size: clamp(0.84rem, 2.3dvh, 1.05rem);
      color: #555;
      background: #FFF9EC;
      border: 1.5px solid #FFE082;
      padding: 6px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      max-width: 720px;
      width: 100%;
      line-height: 1.35;
      word-break: keep-all;
    }

    @media (orientation: landscape) and (max-height: 540px) {
      .solo-view {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
        align-items: center;
        padding: 8px 14px;
        gap: 10px;
      }
      .solo-view > .back-bar {
        width: 100%;
        margin-bottom: 0;
      }
      .solo-big-char {
        font-size: clamp(3.6rem, 26dvh, 6.2rem);
      }
      .solo-idiom-word {
        font-size: clamp(2rem, 15dvh, 3.8rem);
      }
      .solo-sub {
        font-size: clamp(1.05rem, 5dvh, 1.4rem);
      }
      .solo-detail {
        max-width: 440px;
        width: auto;
        font-size: 0.88rem;
        margin-bottom: 0;
      }
      .solo-action-stack {
        width: auto;
        gap: 4px;
      }
    }
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      width: 100%;
      padding: 2px 0;
    }

    #writeCanvas {
      width: min(100%, 420px, 46dvh);
      height: min(100%, 420px, 46dvh);
      min-width: 160px;
      min-height: 160px;
      border: 3px solid #6CD4C3;
      border-radius: 18px;
      background: #fff;
      touch-action: none;
      cursor: crosshair;
      display: block;
    }

    @media (orientation: landscape) and (max-height: 540px) {
      #writeCanvas {
        width: min(72vw, 54dvh);
        height: min(72vw, 54dvh);
        min-width: 180px;
        min-height: 180px;
      }
    }

    .write-controls {
      margin-top: 4px;
      flex-shrink: 0;
    }
    .quiz-char-box {
      font-size: clamp(3.4rem, 14dvh, 8rem);
      line-height: 1.05;
      color: #222;
      background: #FFF9EC;
      border: 3px dashed #FFD166;
      border-radius: 20px;
      padding: 8px 22px;
      margin: 2px auto;
      display: inline-block;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 6px;
    }

    @media (orientation: landscape) and (max-height: 540px) {
      .quiz-box {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 8px 14px;
      }
      .quiz-box > div:first-child {
        flex: 0 0 auto;
        min-width: 150px;
      }
      .quiz-char-box {
        font-size: clamp(3rem, 24dvh, 5.2rem);
        padding: 6px 18px;
      }
      .quiz-options {
        flex: 1;
        margin-top: 0;
        gap: 8px;
      }
      .quiz-opt-btn {
        padding: 10px 8px;
        font-size: 1rem;
      }
      #quizFeedback {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.95);
        padding: 2px 10px;
        border-radius: 8px;
      }
    }

    .quiz-opt-btn {
      background: #FFF9EC;
      border: 2.5px solid #FFD166;
      border-radius: 12px;
      padding: 8px 6px;
      font-size: clamp(0.92rem, 2.4dvh, 1.2rem);
      cursor: pointer;
      word-break: keep-all;
    }

    function isCharMemorized(item) {
      if (!item || !item[0]) return false;
      var key = makeCharKey(item);
      var memo = Array.isArray(progress.memorizedChars) ? progress.memorizedChars : [];
      return memo.indexOf(key) !== -1 || memo.indexOf(item[0]) !== -1;
    }

    function updateSoloMemoButtonUI(item) {
      var btn = document.getElementById('soloHanjaMemoBtn');
      if (!btn || !item) return;
      var checked = isCharMemorized(item);
      if (checked) {
        btn.classList.add('memorized');
        btn.innerHTML = '✅ 암기 완료';
      } else {
        btn.classList.remove('memorized');
        btn.innerHTML = '암기 체크';
      }
    }

    function toggleMemorizedCurrentHanja() {
      if (!selectedHanja || !selectedHanja[0]) return;
      if (!Array.isArray(progress.memorizedChars)) progress.memorizedChars = [];
      var key = makeCharKey(selectedHanja);
      var filtered = progress.memorizedChars.filter(function(entry) {
        return entry !== key && entry !== selectedHanja[0];
      });

      if (filtered.length < progress.memorizedChars.length) {
        progress.memorizedChars = filtered;
        saveProgress();
        updateSoloMemoButtonUI(selectedHanja);
        renderHanjaGrid();
        showToast(selectedHanja[0] + ' 암기 체크를 해제했어요.');
      } else {
        progress.memorizedChars.push(key);
        markCharLearned(selectedHanja);
        saveProgress();
        updateSoloMemoButtonUI(selectedHanja);
        renderHanjaGrid();
        playChime(true);
        showToast(selectedHanja[0] + ' (' + selectedHanja[1] + ') 암기 체크 완료!');
      }
    }

    function markCharLearned(item) {
      if (!item || !item[0]) return;
      if (!Array.isArray(progress.learnedChars)) progress.learnedChars = [];
      var key = makeCharKey(item);
      var exists = progress.learnedChars.some(function(entry) {
        return entry === key || entry === item[0];
      });
      if (!exists) {
        progress.learnedChars.push(key);
        saveProgress();
      }
      refreshQuizPoolBadgeIfNeeded();
    }

    function markCharTraced(item) {
      if (!item || !item[0]) return;
      if (!Array.isArray(progress.tracedChars)) progress.tracedChars = [];
      var key = makeCharKey(item);
      var exists = progress.tracedChars.some(function(entry) {
        return entry === key || entry === item[0];
      });
      if (!exists) {
        progress.tracedChars.push(key);
        saveProgress();
      }
      refreshQuizPoolBadgeIfNeeded();
    }

    var voiceConfigs = {
      girl: { rate: 1.05, pitch: 1.65 },
      woman: { rate: 0.92, pitch: 1.05 },
      boy: { rate: 1.05, pitch: 1.25 },
      man: { rate: 0.85, pitch: 0.65 }
    };

    function changeVoiceProfile() {
      var sel = document.getElementById('voiceProfileSelect');
      if (sel) voiceProfile = sel.value;
      speak('안녕하세요! 신나는 한자 공부 시간이에요.');
    }

    function speak(text) {
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        var cfg = voiceConfigs[voiceProfile] || voiceConfigs.woman;
        u.rate = cfg.rate;
        u.pitch = cfg.pitch;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function playChime(ok) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var freqs = ok ? [523.25, 659.25, 783.99, 1046.5] : [330, 261.63];
        for (var i = 0; i < freqs.length; i++) {
          var osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freqs[i];
          var t = ctx.currentTime + i * 0.09;
          gain.gain.setValueAtTime(0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        }
      } catch (e) {}
    }

    function renderGradeSummaryTable() {
      var tbody = document.querySelector('#gradeSummaryTable tbody');
      if (!tbody) return;
      tbody.innerHTML = '';
      for (var i = 0; i < gradesMeta.length; i++) {
        var g = gradesMeta[i];
        var tr = document.createElement('tr');
        if (currentGrade === g.code) tr.className = 'active-row';
        tr.innerHTML =
          '<td>' + g.code + '</td>' +
          '<td>' + g.readCum.toLocaleString() + '자</td>' +
          '<td>+' + g.add + '자</td>' +
          '<td>' + g.writeCum + '</td>' +
          '<td>' + g.note + '</td>';
        (function(code) {
          tr.onclick = function() {
            var targetBtn = null;
            var btns = document.querySelectorAll('#gradeTabs .cat-btn');
            for (var k = 0; k < btns.length; k++) {
              if (btns[k].textContent.trim() === code) targetBtn = btns[k];
            }
            filterGrade(code, targetBtn);
          };
        })(g.code);
        tbody.appendChild(tr);
      }
    }

    var currentGrade = 'all';
    var hanjaPage = 1;
    var PAGE_SIZE = 30;
    var selectedHanja = hanjaDB[0];

    function filterGrade(grade, btn) {
      currentGrade = grade;
      hanjaPage = 1;
      var btns = document.querySelectorAll('#gradeTabs .cat-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      if (btn) btn.classList.add('active');
      renderGradeSummaryTable();
      closeHanjaSolo(true);
      renderHanjaGrid();
      pushAppHistoryState();
    }

    function getFilteredHanjaList() {
      var q = (document.getElementById('hanjaSearch') ? document.getElementById('hanjaSearch').value : '').trim().toLowerCase();
      var filtered = [];
      for (var i = 0; i < hanjaDB.length; i++) {
        var it = hanjaDB[i];
        if (!Array.isArray(it) || !it[0]) continue;
        if (currentGrade !== 'all' && it[2] !== currentGrade) continue;
        if (q && it[0].indexOf(q) === -1 && String(it[1] || '').toLowerCase().indexOf(q) === -1 && String(it[4] || '').toLowerCase().indexOf(q) === -1) continue;
        filtered.push(it);
      }
      return filtered.length > 0 ? filtered : hanjaDB;
    }

    function findSoloIndex(list, item) {
      if (!list || !item) return -1;
      var idx = list.indexOf(item);
      if (idx !== -1) return idx;
      for (var i = 0; i < list.length; i++) {
        if (list[i][0] === item[0] && list[i][2] === item[2]) {
          return i;
        }
      }
      return -1;
    }

    function updateSoloNavButtons(item) {
      var prevBtn = document.getElementById('soloPrevBtn');
      var nextBtn = document.getElementById('soloNextBtn');
      var list = getFilteredHanjaList();
      var idx = findSoloIndex(list, item);

      if (prevBtn) {

    function drawGuideHanja(item) {
      if (!ctx || !canvas || !item) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.strokeStyle = '#D9EFEA';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 16); ctx.lineTo(canvas.width / 2, canvas.height - 16);
      ctx.moveTo(16, canvas.height / 2); ctx.lineTo(canvas.width - 16, canvas.height / 2);
      ctx.moveTo(24, 24); ctx.lineTo(canvas.width - 24, canvas.height - 24);
      ctx.moveTo(canvas.width - 24, 24); ctx.lineTo(24, canvas.height - 24);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = "700 310px 'Noto Serif KR', 'Batang', serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#E6ECEF';
      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 2;
      ctx.fillText(item[0], canvas.width / 2, canvas.height / 2 + 12);
      ctx.strokeText(item[0], canvas.width / 2, canvas.height / 2 + 12);
      ctx.restore();
    }

    function getCanvasPos(e) {
      var rect = canvas.getBoundingClientRect();
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / Math.max(1, rect.width)),
        y: (cy - rect.top) * (canvas.height / Math.max(1, rect.height))
      };
    }

    function startDraw(e) {
      if (!ctx) return;
      e.preventDefault();
      isDrawing = true;
      var pos = getCanvasPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#FF5E5B';
      ctx.lineWidth = 14;
    }

    function moveDraw(e) {
      if (!isDrawing || !ctx) return;
      e.preventDefault();
      var pos = getCanvasPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      if (!hasDrawnStroke) {
        hasDrawnStroke = true;
        var btn = document.getElementById('completeWriteBtn');
        if (btn) btn.disabled = false;
      }
    }

    function endDraw() { isDrawing = false; }

    if (canvas) {
      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      window.addEventListener('touchend', endDraw);
    }

    var stickerRewards = ['⭐', '🌟', '🎖️', '🏆', '👑', '🀄', '🐉', '🦄', '🚀', '🌈', '🎨', '🍀'];

    function completeWriting() {
      if (!hasDrawnStroke) return;
      markCharTraced(currentWriteItem);
      progress.stars = (progress.stars || 0) + 1;
      progress.written = (progress.written || 0) + 1;
      var reward = stickerRewards[progress.written % stickerRewards.length];
      if (!progress.stickers) progress.stickers = [];
      progress.stickers.push(reward);
      saveProgress();
      updateStatsUI();
      playChime(true);
      showToast('참 잘했어요! ⭐ 별 1개와 ' + reward + ' 스티커 획득! 다음 글자로 넘어가요.');
      speak('정말 반듯하게 잘 썼어요! 다음 글자를 따라 써볼까요?');
      nextWriteHanja(false, true);
    }

    var currentQuizGrade = 'all';
    var currentQuizAnswer = null;
    var lastQuizCharKey = '';
    var quizDeck = [];
    var quizDeckSignature = '';
    var quizLocked = false;

    function getPoolSignature(grade, pool) {
      var keys = [];
      for (var i = 0; i < pool.length; i++) {
        keys.push(makeCharKey(pool[i]));
      }
      keys.sort();
      return (grade || 'all') + '::' + keys.join('||');
    }

    function shuffleItems(list) {
      var arr = list.slice();
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function pickNonRepeatingFromPool(pool, excludeKey) {
      if (!Array.isArray(pool) || pool.length === 0) return null;
      var sig = getPoolSignature(currentQuizGrade, pool);
      if (sig !== quizDeckSignature) {
        quizDeckSignature = sig;
        quizDeck = shuffleItems(pool);
        if (quizDeck.length > 1 && makeCharKey(quizDeck[quizDeck.length - 1]) === excludeKey) {
          var swapIdx = Math.floor(Math.random() * (quizDeck.length - 1));
          var tmpFirst = quizDeck[quizDeck.length - 1];
          quizDeck[quizDeck.length - 1] = quizDeck[swapIdx];
          quizDeck[swapIdx] = tmpFirst;
        }
      }

      if (quizDeck.length === 0) {
        quizDeck = shuffleItems(pool);
      }

      var candidate = quizDeck.pop();
      var candidateKey = makeCharKey(candidate);

      if (candidateKey === excludeKey && pool.length > 1) {
        if (quizDeck.length > 0) {
          var nextIdx = -1;
          for (var k = quizDeck.length - 1; k >= 0; k--) {
            if (makeCharKey(quizDeck[k]) !== excludeKey) {
              nextIdx = k;
              break;
            }
          }
          if (nextIdx >= 0) {
            var alt = quizDeck.splice(nextIdx, 1)[0];
            quizDeck.unshift(candidate);
            candidate = alt;
          }
        } else {
          var fresh = shuffleItems(pool);
          for (var f = 0; f < fresh.length; f++) {
            if (makeCharKey(fresh[f]) !== excludeKey) {
              candidate = fresh[f];
              quizDeck = fresh.filter(function(item) { return item !== candidate; });
              break;
            }
          }
        }
      }

      return candidate;
    }

    function matchesCharEntry(item, entry) {
      if (!item || !item[0] || !entry) return false;
      var key = makeCharKey(item);
      return entry === key || entry === item[0];
    }

    function isCharLearned(item) {
      var learned = Array.isArray(progress.learnedChars) ? progress.learnedChars : [];
      return learned.some(function(entry) { return matchesCharEntry(item, entry); });
    }

    function isCharTraced(item) {
      var traced = Array.isArray(progress.tracedChars) ? progress.tracedChars : [];
      return traced.some(function(entry) { return matchesCharEntry(item, entry); });
    }

    function getGradeQuizCounts(grade) {
      var targetGrade = grade || currentQuizGrade || 'all';
      var learnedCount = 0;
      var tracedCount = 0;
      var memoPool = [];

      for (var i = 0; i < hanjaDB.length; i++) {
        var it = hanjaDB[i];
        if (!Array.isArray(it) || !it[0]) continue;
        if (targetGrade !== 'all' && it[2] !== targetGrade) continue;
        if (isCharLearned(it)) learnedCount++;
        if (isCharTraced(it)) tracedCount++;
        if (isCharMemorized(it)) memoPool.push(it);
      }

      return {
        learnedCount: learnedCount,
        tracedCount: tracedCount,
        memoPool: memoPool
      };
    }

    function updateQuizPoolBadge(counts) {
      var el = document.getElementById('quizPoolCount');
      if (!el) return;
      var c = counts || getGradeQuizCounts(currentQuizGrade);
      var gradeLabel = currentQuizGrade === 'all' ? '전체 급수' : currentQuizGrade;
      el.innerHTML =
        gradeLabel +
        ' 익힌 글자: ' + c.learnedCount + '자 · 따라 쓴 글자: ' + c.tracedCount + '자' +
        ' (암기 체크 출제: ' + c.memoPool.length + '자)';
    }

    function refreshQuizPoolBadgeIfNeeded() {
      updateQuizPoolBadge(getGradeQuizCounts(currentQuizGrade));
    }

    function filterQuizGrade(grade, btn) {
      currentQuizGrade = grade || 'all';
      quizDeck = [];
      quizDeckSignature = '';
      var btns = document.querySelectorAll('#quizGradeTabs .cat-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      if (btn) btn.classList.add('active');
      nextQuiz();
    }

    function goLearnFromQuiz() {
      var tab1Btn = document.querySelectorAll('#mainNav .nav-btn')[0];
      showTab('tab1', tab1Btn);
      if (currentQuizGrade && currentQuizGrade !== 'all') {
        var gradeBtns = document.querySelectorAll('#gradeTabs .cat-btn');
        for (var i = 0; i < gradeBtns.length; i++) {
          if (gradeBtns[i].textContent.trim() === currentQuizGrade) {
            filterGrade(currentQuizGrade, gradeBtns[i]);
            return;
          }
        }
      }
    }

    function isValidKoreanMeaningLabel(val) {
      if (typeof val !== 'string') return false;
      var s = val.trim();
      if (!s) return false;
      if (s.indexOf('급수한자') !== -1 || s.indexOf('배정한자') !== -1) return false;
      if (/^한자\s*[\u3400-\u9FFF\uF900-\uFAFF]/.test(s)) return false;
      var hasHangul = /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(s);
      var hasHanja = /[\u3400-\u9FFF\uF900-\uFAFF]/.test(s);
      return hasHangul && !hasHanja;
    }

    function nextQuiz() {
      quizLocked = false;
      var fb = document.getElementById('quizFeedback');
      var hintBtn = document.getElementById('quizHintBtn');
      var learnBtn = document.getElementById('quizGoLearnBtn');
      var box = document.getElementById('quizOptions');

      if (fb) {
        fb.innerHTML = '';
        fb.style.color = '#333';
      }

      var counts = getGradeQuizCounts(currentQuizGrade);
      var pool = counts.memoPool;
      updateQuizPoolBadge(counts);

      if (pool.length === 0) {
        currentQuizAnswer = null;
        quizDeck = [];
        quizDeckSignature = '';
        var label = currentQuizGrade === 'all' ? '아직' : (currentQuizGrade + '에서 아직');
        document.getElementById('quizGradeBadge').innerHTML = label + ' 암기 체크한 글자가 없어요';
        document.getElementById('quizHanjaChar').innerHTML = '?';
        if (hintBtn) hintBtn.style.display = 'none';
        if (learnBtn) learnBtn.style.display = 'inline-block';
        if (box) box.innerHTML = '';
        if (fb) {
          fb.style.color = '#D96500';
          fb.innerHTML = '1. 급수별 한자에서 글자를 열고 [암기 체크]를 누른 글자만 퀴즈에 나와요!';
        }
        return;
      }

      if (hintBtn) hintBtn.style.display = 'inline-block';
      if (learnBtn) learnBtn.style.display = 'none';

      var correct = pickNonRepeatingFromPool(pool, lastQuizCharKey) || pool[0];
      currentQuizAnswer = correct;
      lastQuizCharKey = makeCharKey(correct);
      var remainingInCycle = quizDeck.length;
      document.getElementById('quizGradeBadge').innerHTML =
        (correct[2] || '') + ' 배정한자 · 이번 바퀴 남은 문제: ' + remainingInCycle + '개 (총 ' + pool.length + '자)';
      document.getElementById('quizHanjaChar').innerHTML = correct[0];

      var validMeanings = [];
      var sourceList = hanjaDB.concat(baseHanjaDB);
      for (var m = 0; m < sourceList.length; m++) {
        var row = sourceList[m];
        if (Array.isArray(row) && isValidKoreanMeaningLabel(row[1])) {
          var cleanM = row[1].trim();
          if (validMeanings.indexOf(cleanM) === -1) validMeanings.push(cleanM);
        }
      }

      var correctLabel = isValidKoreanMeaningLabel(correct[1]) ? correct[1].trim() : '하늘 천';
      var opts = [correctLabel];

      var shuffledPool = validMeanings.slice();
      for (var p = shuffledPool.length - 1; p > 0; p--) {
        var rp = Math.floor(Math.random() * (p + 1));
        var tmpP = shuffledPool[p]; shuffledPool[p] = shuffledPool[rp]; shuffledPool[rp] = tmpP;
      }
      for (var qIdx = 0; qIdx < shuffledPool.length && opts.length < 4; qIdx++) {
        if (opts.indexOf(shuffledPool[qIdx]) === -1) {
          opts.push(shuffledPool[qIdx]);
        }
      }

      var dummyLabels = ['하늘 천', '땅 지', '큰 대', '작을 소', '불 화', '물 수', '사람 인', '날 일'];
      var dIdx = 0;
      while (opts.length < 4 && dIdx < dummyLabels.length) {
        if (opts.indexOf(dummyLabels[dIdx]) === -1) opts.push(dummyLabels[dIdx]);
        dIdx++;
      }

      for (var s = opts.length - 1; s > 0; s--) {
        var r = Math.floor(Math.random() * (s + 1));
        var tmp = opts[s]; opts[s] = opts[r]; opts[r] = tmp;
      }

      if (box) {
        box.innerHTML = '';
        for (var k = 0; k < opts.length; k++) {
          (function(optLabel) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'quiz-opt-btn';
            b.innerHTML = optLabel;
            b.onclick = function() { checkQuizAnswer(optLabel, b); };
            box.appendChild(b);
          })(opts[k]);
        }
      }
    }

    function playQuizHint() {
      if (currentQuizAnswer) speak('활용어는 ' + (currentQuizAnswer[4] || currentQuizAnswer[1] || '') + ' 입니다.');
    }

    function checkQuizAnswer(chosen, btnEl) {
      if (quizLocked || !currentQuizAnswer) return;
      var fb = document.getElementById('quizFeedback');
      if (chosen === currentQuizAnswer[1]) {
        quizLocked = true;
        btnEl.style.background = '#2EC4B6';
        btnEl.style.color = '#fff';
        btnEl.style.borderColor = '#1F8E83';
        if (fb) {
          fb.style.color = '#1F8E83';
          fb.innerHTML = '🎉 정답이에요! ' + currentQuizAnswer[0] + ' (' + currentQuizAnswer[1] + ') (+별 1개)';
        }
        progress.stars = (progress.stars || 0) + 1;
        progress.quiz = (progress.quiz || 0) + 1;
        if (!progress.stickers) progress.stickers = [];
        progress.stickers.push(stickerRewards[(progress.quiz + 2) % stickerRewards.length]);
        saveProgress();
        updateStatsUI();
        playChime(true);
        speak('정답입니다! ' + currentQuizAnswer[1]);
        setTimeout(nextQuiz, 1400);
      } else {
        btnEl.style.background = '#FFE3E3';
        btnEl.style.borderColor = '#FF5E5B';
        if (fb) {
          fb.style.color = '#E03131';
          fb.innerHTML = '앗, 다시 한 번 생각해 볼까요? 힌트 듣기를 눌러보세요!';
        }
        playChime(false);
        speak('다시 한 번 골라볼까요?');
      }
    }

    function updateStatsUI() {
      var starEl = document.getElementById('starCount');
      var writtenEl = document.getElementById('writtenCount');
      var quizEl = document.getElementById('quizScore');
      var memoIdiomEl = document.getElementById('memoIdiomCount');
      var board = document.getElementById('stickerBoard');

      if (starEl) starEl.innerHTML = progress.stars || 0;
      if (writtenEl) writtenEl.innerHTML = progress.written || 0;
      if (quizEl) quizEl.innerHTML = progress.quiz || 0;
      if (memoIdiomEl) {
        memoIdiomEl.innerHTML = Array.isArray(progress.memorizedIdioms) ? progress.memorizedIdioms.length : 0;
      }
      if (board) {
        var list = progress.stickers || [];
        board.innerHTML = list.length > 0
          ? list.join(' ')
          : '<span style="font-size:0.95rem; color:#888;">한자 따라 쓰기와 퀴즈를 완료하면 칭찬 스티커가 모여요!</span>';
      }
    }

    function resetProgress() {
      progress = {
        stars: 0,
        written: 0,
        quiz: 0,
        stickers: [],
        learnedChars: [],
        tracedChars: [],
        memorizedChars: [],
        memorizedIdioms: []
      };
      lastQuizCharKey = '';
      quizDeck = [];
      quizDeckSignature = '';
      saveProgress();
      updateStatsUI();
      renderHanjaGrid();
      renderIdioms();
      if (selectedHanja) updateSoloMemoButtonUI(selectedHanja);
      if (selectedIdiom) updateSoloIdiomMemoButtonUI(selectedIdiom);
      nextQuiz();
      showToast('기록이 초기화되었어요.');
    }

    function showTab(tabId, btn, skipPrevTrack, skipHistoryPush) {
      var activeSec = document.querySelector('.section.active');
      if (!skipPrevTrack && activeSec && activeSec.id && activeSec.id !== 'tab4') {
        previousTabId = activeSec.id;
      }
      if (tabId !== 'tab3') {
        closeIdiomSolo(true);
      }
      var secs = document.querySelectorAll('.section');
      for (var i = 0; i < secs.length; i++) secs[i].classList.remove('active');
      var targetSec = document.getElementById(tabId);
      if (targetSec) targetSec.classList.add('active');

      var navBtns = document.querySelectorAll('#mainNav .nav-btn');
      for (var j = 0; j < navBtns.length; j++) navBtns[j].classList.remove('active');
      if (btn) btn.classList.add('active');

      if (tabId === 'tab4') drawGuideHanja(currentWriteItem);
      if (tabId === 'tab5') nextQuiz();
      if (!skipHistoryPush) pushAppHistoryState();
    }

    function normalizeHanjaList(list) {
      if (!Array.isArray(list)) return [];
      var out = [];
      for (var i = 0; i < list.length; i++) {
        var it = list[i];
        if (Array.isArray(it) && it[0]) {
          out.push(it);
        } else if (it && (it.hanja || it.char || it.word)) {
          out.push([
            it.hanja || it.char || it.word,
            it.huneum || it.meaning || '',
            it.grade || '8급',
            it.strokes || 4,
            it.examples || it.wordSample || ''
          ]);
        }
      }
      return out;
    }

    function normalizeIdiomList(list, fallbackGrade) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(function(item) {
          return item && (item.idiom || item.word || item.hanja);
        })
        .map(function(item) {
          return {
            word: item.hanja || item.word || '',
            read: item.idiom || item.read || '',
            mean: item.meaning || item.mean || '',
            grade: item.grade || fallbackGrade || '필수·1급'
          };
        });
    }

    function renderAllViewsSafely() {
      try { renderGradeSummaryTable(); } catch (e) {}
      try { renderHanjaGrid(); } catch (e) {}
      try { initStrokeRules(); } catch (e) {}
      try { renderIdioms(); } catch (e) {}
      try { startSequentialWriteFromGrade('8급', null); } catch (e) {}
      try { nextQuiz(); } catch (e) {}
      try { updateStatsUI(); } catch (e) {}
    }

    function safeFetchJson(url) {
      try {
        if (typeof fetch !== 'function') {
          return Promise.reject(new Error('fetch unavailable'));
        }
        return fetch(url, { cache: 'no-store' }).then(function(res) {
          if (!res || !res.ok) {
            throw new Error('HTTP ' + (res ? res.status : 'error'));
          }
          return res.json();
        });
      } catch (err) {
        return Promise.reject(err);
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderAllViewsSafely();

      try {
        if (window.history && typeof window.history.replaceState === 'function') {
          window.history.replaceState({
            __hanjaApp: true,
            tabId: 'tab1',
            soloOpen: false,
            soloItem: null,
            idiomSoloOpen: false,
            idiomSoloItem: null
          }, '', window.location.href);
          currentNavState = captureCurrentNavState();
        }
      } catch (e) {}

      var hanjaReq = safeFetchJson('./hanja_8_to_3.json?v=' + Date.now());
      var idiomMainReq = safeFetchJson('./sajaseongeo_1000.json?v=' + Date.now());
      var idiomAdvReq = safeFetchJson('./sajaseongeo_1급심화.json?v=' + Date.now());

      Promise.allSettled([hanjaReq, idiomMainReq, idiomAdvReq])
        .then(function(results) {
          try {
            if (results[0] && results[0].status === 'fulfilled' && Array.isArray(results[0].value) && results[0].value.length > 0) {
              var normHanja = normalizeHanjaList(results[0].value);
              if (normHanja.length > 0) {
                hanjaDB = normHanja;
              }
            }
          } catch (e) {}

          try {
            var mergedIdioms = [];
            if (results[1] && results[1].status === 'fulfilled' && Array.isArray(results[1].value) && results[1].value.length > 0) {
              mergedIdioms = mergedIdioms.concat(normalizeIdiomList(results[1].value, '필수·1급'));
            } else {
              mergedIdioms = mergedIdioms.concat(baseIdiomDB.filter(function(it) { return it.grade !== '1급심화'; }));
            }

            if (results[2] && results[2].status === 'fulfilled' && Array.isArray(results[2].value) && results[2].value.length > 0) {
              mergedIdioms = mergedIdioms.concat(normalizeIdiomList(results[2].value, '1급심화'));
            } else {
              mergedIdioms = mergedIdioms.concat(baseIdiomDB.filter(function(it) { return it.grade === '1급심화'; }));
            }

            if (mergedIdioms.length > 0) {
              idiom1000DB = mergedIdioms;
            }
          } catch (e) {}
        })
        .finally(function() {
          renderAllViewsSafely();
        });
    });
  </script>
